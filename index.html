<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영어 3분기 시험 대비</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#5b3f9e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 시험">
<link rel="stylesheet" href="fonts.css">
<script>try{const t=localStorage.getItem('eng3q-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#16202a; --muted:#596673; --line:#d8dee5;
  --accent:#5b3f9e; --accent-soft:#ece7f8;
  --good:#1d7548; --good-soft:#e2f3ea; --warn:#9a5c00; --warn-soft:#fbf0dc; --bad:#b0281f; --bad-soft:#fbe6e4;
  --hv:#e4ddf7; --hg:#fde7b0; --hg-ink:#7a4a00;
  --f-display:"Bricolage Grotesque","Noto Sans KR",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Noto Sans KR",ui-sans-serif,system-ui,sans-serif;
  --f-text:"Source Serif 4","Noto Sans KR",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --surface:#171c22; --ink:#e5e9ee; --muted:#97a3af; --line:#2b333c;
  --accent:#b9a2f2; --accent-soft:#272040;
  --good:#62c993; --good-soft:#15291f; --warn:#e5a94c; --warn-soft:#2c2213; --bad:#f2827a; --bad-soft:#321a18;
  --hv:#33295a; --hg:#4a3510; --hg-ink:#f3c26b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1317; --surface:#171c22; --ink:#e5e9ee; --muted:#97a3af; --line:#2b333c;
  --accent:#b9a2f2; --accent-soft:#272040;
  --good:#62c993; --good-soft:#15291f; --warn:#e5a94c; --warn-soft:#2c2213; --bad:#f2827a; --bad-soft:#321a18;
  --hv:#33295a; --hg:#4a3510; --hg-ink:#f3c26b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--f-body);word-break:keep-all}
.wrap{max-width:860px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(26px,5.5vw,38px);font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:800}
h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;color:var(--accent)}
.muted{color:var(--muted)}
header{display:grid;gap:6px;position:relative;padding-right:52px}
header .meta{font:500 12.5px var(--f-mono);color:var(--muted)}
/* theme toggle: moon in light mode, sun in dark mode */
.themebtn{position:absolute;top:0;right:0;width:40px;height:40px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.themebtn:hover{border-color:var(--accent);color:var(--accent)}
.themebtn svg{width:20px;height:20px}
.themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .sun{display:block}:root[data-theme="dark"] .themebtn .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .themebtn .sun{display:block}:root:not([data-theme="light"]) .themebtn .moon{display:none}}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.rbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rbar button{font:600 14px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar button .n{font-family:var(--f-mono);margin-right:4px}
.rbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;justify-self:start}
.tabs button{font:600 13.5px var(--f-body);border:none;background:none;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
@media (max-width:560px){.rbar{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{justify-self:stretch}.tabs button{flex:1;padding:6px 6px}}
button:focus-visible,textarea:focus-visible,.hl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{display:grid;gap:30px}
section{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.ghost{font:600 13px var(--f-body);background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;justify-self:start}
.ghost.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* passage */
.texthead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.ctrls{display:flex;gap:6px;flex-wrap:wrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.reading{display:grid;gap:18px;padding:22px 20px}
.subhead{font-size:15px;color:var(--accent);padding-top:10px;border-top:1px solid var(--line)}
.subhead:first-child{padding-top:0;border-top:none}
.rp{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.pn{font:600 13px var(--f-mono);color:var(--accent);background:var(--accent-soft);border:none;border-radius:6px;padding:4px 0;cursor:pointer;margin-top:3px}
.pn[aria-expanded="true"]{background:var(--accent);color:var(--surface)}
.rtext{font-family:var(--f-text);font-size:16.5px;line-height:1.95;word-break:normal;display:grid;gap:4px}
.story .rtext{gap:6px}
.tr{margin-top:8px;font-size:14.5px;line-height:1.8;background:var(--bg);border-left:2px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;display:grid;gap:4px}
@media (max-width:520px){.rp{grid-template-columns:1fr;gap:4px}.pn{justify-self:start;padding:3px 10px}.reading{padding:16px}}
.hl{border-radius:3px;padding:0 2px;margin:0 -2px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl.v{background:var(--hv)}
.hl.g{background:var(--hg);color:var(--hg-ink);font-weight:600}
.hl.g::after{content:"★";font-size:.62em;vertical-align:super;margin-left:1px}
.plain .hl{background:none;color:inherit;font-weight:inherit;padding:0;margin:0}
.plain .hl.g::after{content:none}
.pop{position:absolute;z-index:30;max-width:min(300px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.pop b{font-family:var(--f-text)}
.pop .tag{display:block;font:500 11px var(--f-mono);opacity:.75;margin-top:2px}
/* vocab */
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;align-items:start}
.vgroup{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.vn{font:600 12px var(--f-mono);color:var(--accent)}
.vgroup dl{margin:0;display:grid;gap:3px}
.vgroup dl div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;font-size:14px;padding-block:2px;border-top:1px dashed var(--line)}
.vgroup dl div:first-child{border-top:none}
.vgroup dt{font-weight:600;font-family:var(--f-text)}.vgroup dd{margin:0;color:var(--muted)}
.vgroup.gl{border-color:var(--hg)}
.vgroup.gl .vn{color:var(--hg-ink)}
/* struct */
.struct{width:100%;border-collapse:collapse;font-family:var(--f-text);font-size:14.5px;line-height:1.75;word-break:normal}
.struct th{font:600 13px var(--f-body);text-align:left;background:var(--accent-soft);padding:8px 12px}
.struct td{vertical-align:top;padding:10px 12px;border-top:1px solid var(--line)}
.struct td:first-child{width:20%;font-family:var(--f-body);font-size:13.5px}
.struct td:nth-child(2){width:26%}
@media (max-width:620px){.struct thead{display:none}.struct tr{display:grid;border-top:1px solid var(--line)}.struct td{width:auto!important;border-top:none;padding:6px 14px}.struct td:first-child{padding-top:12px;color:var(--accent)}.struct td:last-child{padding-bottom:12px}}
.blank{font:inherit;color:transparent;background:var(--accent-soft);border:none;border-bottom:1.5px solid var(--accent);border-radius:4px 4px 0 0;padding:0 6px;cursor:pointer;user-select:none}
.blank.show{color:var(--accent);font-weight:600;background:none}
/* study */
.flow{display:grid;gap:0}
.stage{padding:12px 14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:4px;align-content:start}
.stage:first-child{border-radius:10px 0 0 10px}.stage:last-child{border-radius:0 10px 10px 0}
.stage+.stage{border-left:none}
.stage .p{font:500 11px var(--f-mono);color:var(--muted)}
.stage strong{font-family:var(--f-display);font-size:15.5px}
.stage span:last-child{font-size:14px}
.stage.turn{background:var(--accent-soft)}
@media (max-width:680px){.flow{grid-template-columns:1fr!important}.stage:first-child{border-radius:10px 10px 0 0}.stage:last-child{border-radius:0 0 10px 10px}.stage+.stage{border-left:1px solid var(--line);border-top:none}}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.chain span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.chain i{font-style:normal;color:var(--accent);font-weight:600}
.para{display:grid;grid-template-columns:72px 1fr;gap:14px;padding-block:14px;border-top:1px solid var(--line)}
.para:first-child{border-top:none}
.para .tag{font:600 13px var(--f-mono);color:var(--accent)}
.para .tag small{display:block;font:500 11.5px var(--f-body);color:var(--muted);margin-top:2px}
.para .body{display:grid;gap:8px;min-width:0}
.hooks{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.hooks em{font-family:var(--f-text);font-style:italic}
@media (max-width:520px){.para{grid-template-columns:1fr;gap:6px}}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.pair{display:flex;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;font-family:var(--f-text)}
.pair .no{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px;white-space:nowrap}
.pair .yes{color:var(--good);font-weight:600}
.checklist{counter-reset:c;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.checklist li{counter-increment:c;display:grid;grid-template-columns:28px 1fr;gap:8px}
.checklist li::before{content:counter(c);font:600 13px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;height:24px;display:grid;place-items:center}
/* test */
.score{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.score b{font:800 28px var(--f-display);color:var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px}
.qlist{display:grid;gap:14px}
.q .qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q .num{font:600 13px var(--f-mono);color:var(--accent)}
.q .type{font:500 12px var(--f-body);color:var(--muted)}
.q .en{font-family:var(--f-text)}
.passage{font-family:var(--f-text);font-size:15.5px;line-height:1.8;background:var(--bg);border-radius:8px;padding:12px 14px;word-break:normal}
.passage u{text-decoration-color:var(--accent);text-underline-offset:3px}
.passage .box{display:block;margin-top:8px}
.ko{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;text-align:left;font:15px/1.5 var(--f-text);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);color:var(--muted);flex:none}
.opt.right{background:var(--good-soft);border-color:var(--good)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.explain{font-size:14.5px;border-left:2px solid var(--accent);padding-left:12px}
.explain i{font-family:var(--f-text)}
.hint{font-size:13.5px;background:var(--warn-soft);border-radius:8px;padding:8px 12px}
.hint b{color:var(--warn)}
textarea{width:100%;font:15px/1.5 var(--f-text);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;min-height:64px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.checks li::before{content:"○";display:inline-block;width:20px;color:var(--muted)}
.checks li.ok{color:var(--good)} .checks li.ok::before{content:"✓";color:var(--good)}
.checks li.no::before{content:"✗";color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank span{font:500 13px var(--f-mono);border:1px dashed var(--accent);border-radius:6px;padding:2px 8px}
.model{font-family:var(--f-text);background:var(--good-soft);border-radius:8px;padding:10px 12px;font-size:15px;display:grid;gap:4px}
.model .tip{font-family:var(--f-body);font-size:13.5px;color:var(--muted)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:no-preference){.opt,.tabs button,.rbar button{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="eyebrow">2학년 영어 · 3분기 시험 대비</span>
  <h1 id="title">영어 3분기 시험 대비</h1>
  <p class="meta" id="meta"></p>
  <button class="themebtn" id="themebtn" type="button" aria-label="밝은 모드 / 어두운 모드 전환" title="밝은 모드 / 어두운 모드">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<div class="nav">
  <div class="rbar" id="rbar" aria-label="본문 선택"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="text">본문</button>
    <button role="tab" data-t="study">공부하기</button>
    <button role="tab" data-t="test">문제 풀기</button>
  </div>
</div>
<main id="main"></main>
<footer>본문·어휘·구조표는 학교 배부 학습지 기준. 해석, 해설, 예상 문제와 예시 답안은 학습용으로 새로 작성했다. 시험 범위: Reading ①–④ (객관식 70% · 서술형 30%).</footer>
</div>
<div class="pop" id="pop" hidden></div>
<script>
const R=[];
R.push({
id:'r1', num:'①', short:'Virus', title:'The Varied World of Viruses',
source:'YBM 영어Ⅱ Lesson 3. Living with Viruses',
paras:[
 {n:'[1]',en:'It {appears|appear} that viruses {exist} {solely} to bring {suffering} to {humanity}. The 1918 influenza {pandemic} is {estimated|estimate} to have killed 50 to 100 million people. {Smallpox|smallpox} {claimed|claim} the lives of a further 200 million people in the 20th century alone, according to estimates. And of course, the recent COVID-19 pandemic has taken several million lives, {affecting|affect} almost every {aspect} of human life worldwide.',
  ko:'바이러스는 오로지 인류에게 고통을 주기 위해 존재하는 것처럼 보인다. 1918년 인플루엔자 대유행은 5천만 명에서 1억 명의 목숨을 앗아간 것으로 추정된다. 추정치에 따르면 천연두는 20세기에만 2억 명의 목숨을 추가로 앗아갔다. 그리고 물론 최근의 COVID-19 대유행은 수백만 명의 목숨을 앗아갔으며, 전 세계 인간 삶의 거의 모든 측면에 영향을 미쳤다.'},
 {n:'[2]',en:'{Outbreaks|outbreak} of {viral} diseases are {frequently} {linked to|be linked to} contact with wild animals such as bats. Such contacts allow new viruses to enter human bodies that have no {prior} {immunity} to such viruses. Historically, natural {barriers|barrier} such as mountains and forests prevented animal viruses from {infecting|infect} humans. {Industrialization|industrialization} has {destroyed|destroy} these barriers, and climate change has pushed some wild animals out of their original {habitats|habitat}. These changes have resulted in an increase in {interactions|interaction} between human and wild animals, meaning more opportunities for the viruses {present} in wild animals to {spread} to humans. This is the {primary} reason for scientists’ {concern} that pandemics may increase in the future. Then, is the virus truly a harmful {presence} to humans? {Not necessarily|not necessarily}.',
  ko:'바이러스성 질병의 발생은 박쥐와 같은 야생동물과의 접촉과 자주 연관된다. 이러한 접촉은 새로운 바이러스가 그러한 바이러스에 대한 기존 면역력이 없는 인간의 몸에 침투하도록 한다. 역사적으로 산과 숲 같은 자연 장벽은 동물 바이러스가 인간을 감염시키는 것을 막았다. 산업화는 이러한 장벽을 파괴했고, 기후 변화는 일부 야생동물을 원래의 서식지 밖으로 내몰았다. 이러한 변화로 인해 인간과 야생동물 간의 상호작용이 증가했고, 이는 야생동물에 존재하는 바이러스가 인간에게 전파될 기회가 더 많아졌다는 것을 의미한다. 이것이 앞으로 대유행이 증가할 수 있다는 과학자들의 우려의 주된 이유이다. 그렇다면 바이러스는 정말 인간에게 해로운 존재일까? 꼭 그렇지는 않다.'},
 {h:'Keepers of the Earth [3]~[6]'},
 {n:'[3]',en:'What is less commonly known is that viruses play {crucial} {roles|play a role} in supporting much of life on Earth. This is because researchers have only recently begun {investigating|investigate} the viruses that {sustain} us and the planet, instead of just those that harm us. Therefore, scientists have much more to learn about viruses than they {currently} know. What they do know is that viruses act as the primary {regulators|regulator} of bacterial and insect populations.',
  ko:'덜 알려진 사실은 바이러스가 지구상의 많은 생명체를 지탱하는 데 결정적인 역할을 한다는 것이다. 이는 연구자들이 우리에게 해를 끼치는 바이러스만이 아니라 우리와 지구를 지탱하는 바이러스를 조사하기 시작한 것이 최근에 와서이기 때문이다. 따라서 과학자들은 바이러스에 대해 현재 아는 것보다 배워야 할 것이 훨씬 더 많다. 그들이 확실히 알고 있는 것은 바이러스가 박테리아와 곤충 개체수의 주된 조절자 역할을 한다는 것이다.'},
 {n:'[4]',en:'Since viruses do not have {reproductive} functions {on their own|on one’s own}, they steal the reproductive functions of other organisms to {multiply}. Some types of viruses use bacteria. When the virus continues to multiply inside the bacteria, the bacteria {eventually} die, and the newly produced viruses go on to infect other bacteria. This whole process helps viruses control the {excessive} growth of certain bacteria.',
  ko:'바이러스는 스스로 번식 기능을 갖고 있지 않기 때문에, 증식하기 위해 다른 생물의 번식 기능을 훔친다. 어떤 종류의 바이러스는 박테리아를 이용한다. 바이러스가 박테리아 안에서 계속 증식하면 박테리아는 결국 죽고, 새로 생겨난 바이러스는 이어서 다른 박테리아를 감염시킨다. 이 전체 과정은 바이러스가 특정 박테리아의 과도한 증식을 억제하도록 돕는다.'},
 {n:'[5]',en:'The greater {significance} of viruses infecting bacteria is that they play a {vital} role in {supplying|supply} oxygen to our planet. About half of the oxygen on Earth is produced by plankton in the oceans, and the primary food source for these plankton is {nutrients|nutrient} {released|release} from bacteria killed by viral infections. If viruses did not infect and kill bacteria, there would be no bacterial {remains}, {leading to|lead to} a {lack} of plankton. Without plankton, half of Earth’s oxygen would {disappear}. In short, without viruses, the lack of oxygen would make it impossible for humans to survive.',
  ko:'바이러스가 박테리아를 감염시키는 것의 더 큰 의미는 그것이 지구에 산소를 공급하는 데 필수적인 역할을 한다는 것이다. 지구 산소의 약 절반은 바다의 플랑크톤이 생산하며, 이 플랑크톤의 주요 먹이는 바이러스 감염으로 죽은 박테리아에서 방출되는 영양소이다. 만약 바이러스가 박테리아를 감염시켜 죽이지 않는다면 박테리아 잔해가 없을 것이고, 이는 플랑크톤의 부족으로 이어질 것이다. 플랑크톤이 없으면 지구 산소의 절반이 사라질 것이다. 요컨대, 바이러스가 없다면 산소 부족으로 인해 인간은 생존할 수 없을 것이다.'},
 {n:'[6]',en:'Insect species populations are also regulated by viruses. When a {specific} type of insect increases excessively, the viruses that infect those insects also increase, reducing their numbers. This, {in turn}, creates room for other types of insects to {flourish}. Considering the chain of food in nature, it would not be difficult to assume that viruses {fulfill} important functions in regulating other species. We have just started to understand their various roles in the ecosystem.',
  ko:'곤충 종의 개체수 또한 바이러스에 의해 조절된다. 특정 종류의 곤충이 과도하게 증가하면 그 곤충을 감염시키는 바이러스도 증가하여 개체수를 줄인다. 이것은 결국 다른 종류의 곤충이 번성할 공간을 만든다. 자연의 먹이 사슬을 고려하면, 바이러스가 다른 종을 조절하는 데 중요한 기능을 수행한다고 짐작하는 것은 어렵지 않을 것이다. 우리는 생태계에서 바이러스의 다양한 역할을 이제 막 이해하기 시작했다.'},
 {h:'Means for Cures [7]~[8]'},
 {n:'[7]',en:'As scientific knowledge about viruses continues to {expand}, new opportunities for {utilizing|utilize} them in the battle against diseases are {arising|arise}. Of {notable} interest are the areas of gene {therapy} and cancer treatment. Genes can be compared to {instruction guides|instruction guide} that {govern} how our bodies {function}. Sometimes, people are born with genetic {disorders|disorder}, which can lead to health problems. Gene therapy steps in to fix these issues. The {essence} of gene therapy {lies|lie} in {delivering|deliver} corrected genetic instructions to a patient’s cells, {enabling|enable} them to function {properly}. In this process, specially {modified} viruses are used as one of the carriers of the genetic instructions. If the patient’s cells function properly, it can potentially help the body fight off certain diseases.',
  ko:'바이러스에 대한 과학 지식이 계속 확대됨에 따라, 질병과의 싸움에 바이러스를 활용할 새로운 기회가 생겨나고 있다. 특히 주목할 만한 분야는 유전자 치료와 암 치료이다. 유전자는 우리 몸이 어떻게 기능하는지를 지배하는 설명서에 비유될 수 있다. 때때로 사람들은 유전 질환을 갖고 태어나는데, 이는 건강 문제로 이어질 수 있다. 유전자 치료는 이러한 문제를 해결하기 위해 나선다. 유전자 치료의 본질은 교정된 유전 정보를 환자의 세포에 전달하여 세포가 제대로 기능할 수 있게 하는 데 있다. 이 과정에서 특별히 변형된 바이러스가 유전 정보의 운반체 중 하나로 사용된다. 환자의 세포가 제대로 기능하면, 그것은 잠재적으로 몸이 특정 질병을 물리치도록 도울 수 있다.'},
 {n:'[8]',en:'Using viruses to treat cancer, another use of viruses, is based on the {notion} of utilizing their natural ability to infect and kill cells. If successful, viruses can be {manipulated|manipulate} to specifically {target} and destroy cancer cells while leaving healthy cells {unharmed}. The use of viruses in gene therapy and cancer treatment is still in the early stages. However, many researchers {are involved in|be involved in} hundreds of projects with the goal of discovering cures for diseases that were once thought to be {incurable}.',
  ko:'바이러스의 또 다른 용도인, 바이러스를 이용한 암 치료는 세포를 감염시켜 죽이는 바이러스의 타고난 능력을 활용한다는 개념에 기초한다. 성공한다면, 바이러스를 조종하여 건강한 세포는 손상시키지 않은 채 암세포만을 표적으로 삼아 파괴하게 할 수 있다. 유전자 치료와 암 치료에서의 바이러스 활용은 아직 초기 단계에 있다. 그러나 많은 연구자들이 한때 불치병으로 여겨졌던 질병의 치료법을 발견한다는 목표를 가지고 수백 개의 프로젝트에 참여하고 있다.'}
],

struct:{head:['Title','Main Idea','Details'],rows:[
 ['<b>[1]</b><br>Deadly Viruses','Viruses have caused many fatal pandemics.','① {{the 1918 influenza pandemic}} : 50 to 100 million deaths<br>② {{smallpox}} : about 200 million deaths in the 20th century<br>③ {{COVID-19}} : {{several million deaths}}'],
 ['<b>[2]</b><br>The Growing Threats','Pandemics may {{increase}} due to industrialization and climate change.','{{Industrialization}} destroys natural barriers &amp; {{climate change}} forces animals to move<br>→ {{increased interactions}} between human and wild animals<br>→ the spread of viruses from {{wild animals}} to humans → more pandemics'],
 ['<b>[3]~[6]</b><br>Keepers of the Earth','Viruses are essential for maintaining ecological balance and supporting life on Earth.','① Viruses control the {{excessive}} growth of certain bacteria<br>② Viral infections → Nutrients released from dead {{bacteria}} → Food source for plankton → {{oxygen}} production<br>③ {{Insect}} species populations are also regulated by viruses.'],
 ['<b>[7]~[8]</b><br>Means for Cures','Viruses offer new possibilities for treating diseases.','① {{Gene therapy}}: Specially modified viruses are used as one of the carriers of the genetic instructions.<br>② {{Cancer treatment}}: They can be manipulated to target and destroy cancer cells.']
]},
flowTitle:'논지는 네 단계로 전개된다',
flowNote:'글쓴이는 바이러스를 ‘악당’으로 소개한 뒤, 독자의 생각을 뒤집는다. 순서·삽입 문제는 이 전환이 <b>어디서</b> 일어나는지를 묻는다.',
flow:[['[1]','치명적인 바이러스','1918년 독감, 천연두, COVID-19 같은 대유행'],['[2]','커지는 위협','산업화·기후 변화로 인간과 야생동물 사이의 장벽이 무너짐'],['[3]–[6]','반전: 지구의 수호자','"Not necessarily." 바이러스는 생태계의 균형을 유지한다',1],['[7]–[8]','치료의 수단','변형된 바이러스로 유전자 전달, 암세포 공격']],
chain:{title:'가장 자주 출제되는 인과 사슬: 바이러스가 없으면 인간도 없다',items:['바이러스가 박테리아를 감염·사멸','죽은 박테리아가 영양소 방출','플랑크톤의 주된 먹이','플랑크톤이 지구 산소의 약 절반 생산'],note:'함정 주의: 산소를 만드는 것은 <b>플랑크톤</b>이다. 바이러스나 박테리아가 직접 만드는 것이 아니다. 첫 고리(바이러스의 박테리아 감염)가 끊기면 사슬 전체가 무너지므로, 글은 "바이러스가 없으면 인간은 생존할 수 없다"고 결론짓는다.'},
notes:[
 ['[1]','악당 소개','바이러스가 얼마나 치명적인지 먼저 보여 주어, 뒤에 나올 반전의 효과를 키운다.',['<em>is estimated to have killed</em>: 완료부정사. ‘죽인 것’이 ‘추정하는 시점’보다 앞선 일이므로 <i>to have p.p.</i>','<em>It appears that viruses exist…</em> = <em>Viruses appear to exist…</em> (문장 전환 서술형 단골)','<em>claimed the lives of</em>: 여기서 <i>claim</i>은 ‘주장하다’가 아니라 ‘(목숨을) 앗아가다’.','<em>affecting almost every aspect</em>: 결과의 분사구문.']],
 ['[2]','원인 사슬','산업화가 자연 장벽을 파괴하고, 기후 변화가 동물을 서식지 밖으로 내몬다. 인간과 야생동물의 접촉이 늘수록 바이러스가 인간에게 옮을 기회도 늘어난다.',['<em>are frequently linked to</em>: 주어 <i>Outbreaks</i>(복수) → <i>are</i>.','<em>allow O to-v</em> / <em>prevent O from v-ing</em>: 어법 문제에서 서로 바꿔치기하기 좋은 짝.','<em>have resulted in an increase</em>: <i>result in</i> = ~을 초래하다, <i>result from</i> = ~에서 비롯되다.','<em>opportunities for the viruses present in wild animals to spread</em>: <i>for</i> + 의미상 주어 + to부정사, 명사 뒤 <i>present</i> = ‘존재하는’.','<em>concern that pandemics may increase</em>: <i>that</i> 뒤가 완전한 절 → 동격의 that.','"Then, is the virus truly a harmful presence to humans? Not necessarily." → 순서·삽입 문제의 <b>전환점</b>.']],
 ['[3]','반전','바이러스는 지구 생명을 지탱하지만, 이로운 바이러스에 대한 연구가 최근에야 시작되어 잘 알려지지 않았다.',['<em>What is less commonly known is that…</em>: what절 주어는 단수 취급 → <i>is</i>.','<em>What they do know is that…</em>: <i>do</i>는 동사 강조.','<em>have only recently begun investigating</em>: ‘최근에야’ → 빈칸·어휘 문제 재료.','바이러스는 박테리아와 곤충 개체수의 <em>primary regulators</em>(주된 조절자). 요지 문장.']],
 ['[4]','박테리아','바이러스는 스스로 번식할 수 없어 박테리아의 번식 기능을 훔친다. 박테리아 안에서 증식 → 박테리아 사멸 → 새 바이러스가 다른 박테리아 감염. 결과적으로 박테리아의 <b>과도한</b> 증식을 억제한다.',['<em>Since</em> = ~ 때문에 (이유). ‘~ 이래로’가 아님.','<em>go on to infect</em>: 이어서 ~하다.','<em>helps viruses control</em>: <i>help</i> O (to) 동사원형.']],
 ['[5]','산소','위 인과 사슬이 바로 이 문단이다.',['<em>The greater significance of viruses infecting bacteria is that…</em>: 주어 핵심은 <i>significance</i> → <i>is</i>.','<em>the primary food source … is nutrients</em>: 동사는 주어 <i>source</i>에 일치 → <i>is</i>.','<em>nutrients released from bacteria killed by viral infections</em>: 명사를 뒤에서 꾸미는 과거분사 두 번 연속.','<em>If viruses did not infect…, there would be no…</em>: 가정법 과거.','<em>leading to a <b>lack</b> of plankton</em>: 어휘 문제에서 <i>surplus/increase</i>로 바뀔 수 있음.','<em>make it impossible for humans to survive</em>: 가목적어 it + 의미상 주어 + 진목적어 to부정사.']],
 ['[6]','곤충','특정 곤충이 과도하게 늘면 그 곤충을 감염시키는 바이러스도 늘어 개체수를 줄인다. 그 결과 다른 곤충이 번성할 공간이 생긴다.',['<em>the viruses that infect those insects also increase, reducing their numbers</em>: 결과의 분사구문.','<em>creates room for other types of insects to flourish</em>: for + 의미상 주어 + to부정사.','<em>Considering …, it would not be difficult to assume that…</em>: 분사구문 + 가주어 it.']],
 ['[7]','유전자 치료','유전자는 몸의 기능을 지배하는 ‘설명서’와 같다. 유전자 치료는 교정된 유전 정보를 세포에 전달하며, 특별히 변형된 바이러스가 그 운반체 중 하나로 쓰인다.',['<em>Of notable interest <b>are</b> the areas…</em>: 도치. 진짜 주어 <i>the areas</i>(복수) → <i>are</i>.','<em>genetic disorders, which can lead to…</em>: 계속적 용법의 which.','<em>lies in delivering</em>: <i>lie in</i> + 동명사 = ~에 있다.','<em>enabling them to function properly</em>: <i>enable</i> O to-v.','<em>help the body fight off</em>: <i>help</i> O 동사원형.']],
 ['[8]','암 치료','바이러스는 원래 세포를 감염시켜 죽이는 능력이 있으므로, 이를 조종해 암세포만 공격하게 할 수 있다. 아직 초기 단계이지만 수많은 연구가 진행 중이다.',['<em>Using viruses to treat cancer, another use of viruses, <b>is</b> based on…</em>: 동명사 주어 + 동격 삽입 → 단수 동사.','<em>If successful,</em> = If it is successful (주어+be동사 생략).','<em>while leaving healthy cells unharmed</em>: <i>leave</i> O + 형용사.','<em>The use of viruses in … treatment <b>is</b> still…</em>: 주어는 <i>use</i> → <i>is</i>.','<em>diseases that were once thought to be incurable</em>: ‘한때 불치병으로 여겨졌던’.']]
],

mc:[

 {type:'어휘',prompt:'다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?',

R.push({
id:'r2', num:'②', short:'Lifting Objects', title:'Lifting Objects',
source:'Adapted from <i>Here’s how to levitate something without magic</i> (Science News Explores, December 10, 2025)',
paras:[
 {h:'Let’s make some noise [1]~[2]'},
 {n:'[1]',en:'If you’ve ever been to a concert where the music was so loud you felt it {thumping} in your chest, then you know {firsthand} how strong sound waves can be. [[Acoustic|acoustic]] [[levitation]] devices use those {vibrations|vibration} to hold objects in the air. An acoustic levitator works like a very {complicated} surround-sound system. It may contain hundreds of little speakers. Those speakers {typically} [[blare]] noise at a {frequency} of 40 kilohertz. Humans can’t hear these sounds, but the sound-pressure levels are higher than those of a jet engine. Sound waves from an acoustic levitator create {alternating} spots in the air of high- and low-{intensity} noise. The force of sound pushes objects away from the loud areas. As a result, items placed in quiet areas will stay there, as if {tucked|tuck} into {invisible} pockets. Fine-tuning the noise {blasted|blast} by each speaker can {steer} those pockets around.',
  ko:'음악이 너무 커서 가슴이 쿵쿵 울리는 것을 느낄 정도의 콘서트에 가 본 적이 있다면, 음파가 얼마나 강할 수 있는지 직접 알고 있을 것이다. 음향 공중 부양 장치는 그 진동을 이용해 물체를 공중에 띄워 둔다. 음향 부양기는 매우 복잡한 서라운드 음향 시스템처럼 작동한다. 그것은 수백 개의 작은 스피커를 포함할 수 있다. 그 스피커들은 보통 40킬로헤르츠의 주파수로 소리를 요란하게 울린다. 인간은 이 소리를 들을 수 없지만, 음압 수준은 제트 엔진의 음압보다 더 높다. 음향 부양기에서 나오는 음파는 공중에 강도가 높은 소리와 낮은 소리의 지점이 번갈아 나타나게 만든다. 소리의 힘은 물체를 시끄러운 영역에서 밀어낸다. 그 결과, 조용한 영역에 놓인 물체는 마치 보이지 않는 주머니 속에 집어넣어진 것처럼 그곳에 머문다. 각 스피커에서 내보내는 소리를 미세 조정하면 그 주머니들을 이리저리 움직일 수 있다.'},
 {n:'[2]',en:'Acoustic levitation can lift all types of materials, solid or liquid. But it can only support very small, {lightweight} things. Some of the heaviest stuff to ever {surf} sound waves were Styrofoam {puffs|puff} (like those inside beanbag chairs). Taller and wider objects need longer, lower-frequency sound waves to support them. Say you wanted to levitate a person — even someone {curled|curl} into a ball. It would probably take at least 275-hertz waves, which are 1.25 meters (some 4 feet) long. Bass guitars play notes about that low. But the music from a bass guitar levitator would also have to be [[devastatingly]] loud to lift someone off their feet. Running such a device would probably require quite a few {power plants|power plant}, but maybe a big {nuclear} one could do it. On top of that, you’d need to {shield} anyone you levitated from the heat {generated|generate} by that amount of power. {Otherwise}, your powerful, nuclear-powered bass solo might {literally} melt their face off.',
  ko:'음향 공중 부양은 고체든 액체든 모든 종류의 물질을 들어 올릴 수 있다. 하지만 아주 작고 가벼운 것만 떠받칠 수 있다. 지금까지 음파를 탄 가장 무거운 것 중 하나는 (빈백 의자 안에 든 것 같은) 스티로폼 조각이었다. 더 크고 넓은 물체를 떠받치려면 더 길고 주파수가 낮은 음파가 필요하다. 사람을, 심지어 공처럼 몸을 웅크린 사람을 띄우고 싶다고 해 보자. 아마 적어도 275헤르츠의 음파가 필요할 텐데, 그 파장은 1.25미터(약 4피트)이다. 베이스 기타가 대략 그 정도로 낮은 음을 연주한다. 하지만 베이스 기타 부양기의 음악은 사람을 땅에서 들어 올리려면 파괴적일 정도로 엄청나게 시끄러워야 할 것이다. 그런 장치를 가동하려면 아마 꽤 많은 발전소가 필요하겠지만, 어쩌면 큰 원자력 발전소 하나로 가능할지도 모른다. 게다가 그만한 전력에서 발생하는 열로부터 공중에 띄운 사람을 보호해야 할 것이다. 그렇지 않으면 여러분의 강력한 원자력 베이스 솔로가 말 그대로 그들의 얼굴을 녹여 버릴지도 모른다.'},
 {h:'The might of magnets [3]~[5]'},
 {n:'[3]',en:'Magnets already safely lift objects much bigger than people off the ground. Perhaps the most {striking} example of that great {strength} is a [[maglev train]]. Magnets on its cars and tracks {interact} to create an upward force. It lets the train stay about 10 centimeters (4 inches) above the track. This allows the train to {glide} nearly {friction}-free and travel twice as fast as trains that roll on rails. Magnetic levitation is not limited to magnetic metals. [[Diamagnetic|diamagnetic]] materials also can {accomplish} this {feat}. Around a strong magnet, these materials can become weakly magnetized and start to push the magnet away. This force is weak, but it can win a fight against gravity. [[Graphite|graphite]], gold and many other {substances|substance} are diamagnetic. Water, proteins and other {molecules|molecule} in living {tissue} are, too.',
  ko:'자석은 이미 사람보다 훨씬 큰 물체를 안전하게 땅에서 들어 올린다. 그 엄청난 힘의 가장 인상적인 예는 아마 자기부상열차일 것이다. 열차 차량과 선로에 있는 자석들이 상호 작용하여 위쪽으로 향하는 힘을 만든다. 그 힘 덕분에 열차는 선로 위 약 10센티미터(4인치)에 떠 있게 된다. 이로 인해 열차는 거의 마찰 없이 미끄러지듯 나아가고, 레일 위를 구르는 열차보다 두 배 빠르게 달릴 수 있다. 자기 부양은 자성을 띤 금속에만 국한되지 않는다. 반자성 물질도 이 놀라운 일을 해낼 수 있다. 강한 자석 주변에서 이 물질들은 약하게 자화되어 자석을 밀어내기 시작할 수 있다. 이 힘은 약하지만 중력과의 싸움에서 이길 수 있다. 흑연, 금, 그리고 많은 다른 물질들이 반자성을 띤다. 물, 단백질, 그리고 살아 있는 조직 속의 다른 분자들도 마찬가지이다.'},
 {n:'[4]',en:'In 1997, two scientists famously used that fact to levitate a frog. They placed the creature inside a magnet made from two {nested} coils of wire. The field created by the device was 16 [[teslas|tesla]]. That’s about 10 times as strong as the magnets used to pick up cars in [[junkyards|junkyard]]. And it was just enough to [[buoy]] the frog near the top of the inner coil of wire. That coil was 18 centimeters (7 inches) tall.',
  ko:'1997년, 두 과학자가 그 사실을 이용해 개구리를 공중에 띄운 것으로 유명하다. 그들은 그 생물을 서로 포개진 두 개의 전선 코일로 만든 자석 안에 넣었다. 그 장치가 만든 자기장은 16테슬라였다. 그것은 고철 처리장에서 자동차를 들어 올리는 데 쓰이는 자석보다 약 10배 강한 것이다. 그리고 그것은 개구리를 안쪽 전선 코일의 꼭대기 근처에 띄우기에 딱 충분했다. 그 코일의 높이는 18센티미터(7인치)였다.'},
 {n:'[5]',en:'In theory, a person could also be made to {float}. But you’d need an extremely powerful magnet. In 1998, one of the frog floaters {estimated|estimate} that you’d need a 40-tesla field created by a magnet running on 1 gigawatt of power. That’s {roughly} half the power produced by the Hoover Dam. There’s another catch with magnetism: its short {range}. You have to be close to a magnet to feel its effects. So making something {soar} through the sky would likely require some other tech.',
  ko:'이론상으로는 사람도 뜨게 만들 수 있다. 하지만 극도로 강력한 자석이 필요할 것이다. 1998년, 개구리를 띄운 과학자 중 한 명은 1기가와트의 전력으로 작동하는 자석이 만든 40테슬라의 자기장이 필요할 것이라고 추정했다. 그것은 후버 댐이 생산하는 전력의 대략 절반이다. 자기에는 또 다른 문제점이 있는데, 바로 작용 거리가 짧다는 것이다. 자석의 효과를 느끼려면 자석 가까이에 있어야 한다. 그래서 무언가를 하늘 높이 날아오르게 하려면 아마 다른 기술이 필요할 것이다.'},
 {n:'[6]',en:'All told, real-world levitation likely won’t ever {measure up to} the superpowers seen on screen. {Still}, it needn’t be {dramatic} to be useful. Acoustic levitation could {handle} tiny electronic {components|component} or lab samples without touching them. That would cut the risk of {contaminating|contaminate} them. Magnetic levitation can make parts of motors float. That way they can spin faster without wearing down. Scientists are still dreaming up new uses for levitation, too — ones that play to different techniques’ natural strengths and won’t risk frying anything during {takeoff}.',
  ko:'종합하면, 현실 세계의 공중 부양은 아마 화면 속 초능력에는 결코 필적하지 못할 것이다. 그럼에도 불구하고, 유용하기 위해 극적일 필요는 없다. 음향 부양은 작은 전자 부품이나 실험실 시료를 건드리지 않고 다룰 수 있다. 그렇게 하면 그것들을 오염시킬 위험이 줄어들 것이다. 자기 부양은 모터 부품을 띄울 수 있다. 그렇게 하면 부품이 닳지 않고 더 빨리 회전할 수 있다. 과학자들은 또한 공중 부양의 새로운 용도를 계속 구상하고 있는데, 각 기술의 타고난 강점을 살리고 이륙하는 동안 무엇도 태워 버릴 위험이 없는 용도들이다.'}
],

R.push({
id:'r3', num:'③', short:'Button, Button', title:'Button, Button',
source:'An adapted excerpt from “Button, Button” by Richard Matheson (1970)',
story:true,
paras:[
 {n:'[1]',en:'The package was lying by the front door — a cube-shaped carton {sealed|seal} with tape, their name and address printed by hand: “Mr. and Mrs. Aurthur Lewis, 21 7 E. Thirty-seventh Street, New York, New York 10016.”\nNorma picked it up and opened the package.\nInside the carton was a push-button unit {fastened|fasten} to a small wooden box. A glass dome covered the button. Norma tried to lift it off, but it was locked in place. She turned the unit over and saw a folded piece of paper Scotch-taped to the bottom of the box. She pulled it off: “Mr. Steward will call on you at 8:00 P.M.”',
  ko:'소포가 현관문 옆에 놓여 있었다. 테이프로 봉해진 정육면체 모양의 상자였고, 그들의 이름과 주소가 손으로 쓰여 있었다. "아서 루이스 부부, 뉴욕주 뉴욕시 동 37번가 217, 10016."\n노마는 그것을 집어 들고 소포를 열었다.\n상자 안에는 작은 나무 상자에 고정된 누름 버튼 장치가 있었다. 유리 덮개가 버튼을 덮고 있었다. 노마는 그것을 들어 올리려 했지만 제자리에 잠겨 있었다. 그녀가 장치를 뒤집어 보니 상자 바닥에 접힌 종이 한 장이 스카치테이프로 붙어 있었다. 그녀가 그것을 떼어 냈다. "스튜어드 씨가 오후 8시에 방문할 것입니다."'},
 {n:'[2]',en:'The doorbell rang at eight o’clock. “I’ll get it,” Norma called from the kitchen. Arthur was in the living room, reading.\nThere was a small man in the hallway.\n“Mrs. Lewis?” he {inquired|inquire} politely.\n“Yes?”\n“I’m Mr. Steward.”\n“Oh, yes.” Norma {repressed|repress} a smile. She was sure now it was a {sales pitch}.\n“May I come in?” asked Mr. Steward.\nThey went into the living room and Mr. Steward sat in Norma’s chair. He reached into an inside coat pocket and {withdrew|withdraw} a small sealed envelope. “Inside here is a key to the bell-unit dome,” he said. He set the envelope on the chair-side table. “The bell is connected to our office.”\n“What’s it for?” asked Arthur.\n“If you push the button,” Mr. Steward told him, “somewhere in the world, someone you don’t know will die. In return, you will receive a payment of $50,000.”\nNorma stared at the small man. He was smiling.\n“What are you talking about?” Arthur asked him.\nMr. Steward looked surprised. “But I’ve just explained,” he said.\n“Is this a practical joke?” asked Arthur.\n“Not at all. The offer is completely {genuine}.”\n“You aren’t making sense. I think you’d better leave,” Arthur said, standing.\nMr. Steward rose. “Of course.”\n“And take your button unit with you.”\n“Are you sure you wouldn’t care to think about it for a day or so?”\nArthur picked up the button unit and the envelope and thrust them into Mr. Steward’s hands. He walked into the hall and pulled open the door.\n“I’ll leave my card,” said Mr. Steward. He placed it on the table by the door.\nWhen he was gone, Arthur tore it in half and tossed the pieces onto the table.',
  ko:'8시 정각에 초인종이 울렸다. "내가 나갈게요." 노마가 부엌에서 외쳤다. 아서는 거실에서 책을 읽고 있었다.\n복도에 작은 남자가 서 있었다.\n"루이스 부인이시죠?" 그가 공손하게 물었다.\n"네?"\n"스튜어드입니다."\n"아, 네." 노마는 웃음을 참았다. 그녀는 이제 그것이 판매 권유라고 확신했다.\n"들어가도 될까요?" 스튜어드 씨가 물었다.\n그들은 거실로 들어갔고 스튜어드 씨는 노마의 의자에 앉았다. 그는 코트 안주머니에 손을 넣어 봉인된 작은 봉투를 꺼냈다. "이 안에 버튼 장치 덮개의 열쇠가 들어 있습니다." 그가 말했다. 그는 봉투를 의자 옆 탁자에 올려놓았다. "그 버튼은 저희 사무실과 연결되어 있습니다."\n"그게 무슨 용도죠?" 아서가 물었다.\n"버튼을 누르시면," 스튜어드 씨가 그에게 말했다. "세상 어딘가에서 당신이 모르는 누군가가 죽게 됩니다. 그 대가로 당신은 5만 달러를 받게 됩니다."\n노마는 그 작은 남자를 빤히 쳐다보았다. 그는 웃고 있었다.\n"무슨 말씀을 하시는 겁니까?" 아서가 그에게 물었다.\n스튜어드 씨는 놀란 표정을 지었다. "방금 설명해 드렸는데요." 그가 말했다.\n"이거 짓궂은 장난입니까?" 아서가 물었다.\n"전혀 아닙니다. 이 제안은 완전히 진짜입니다."\n"말이 안 되는군요. 가시는 게 좋겠습니다." 아서가 일어서며 말했다.\n스튜어드 씨가 일어났다. "물론이죠."\n"그리고 당신의 버튼 장치도 가져가세요."\n"하루쯤 생각해 보지 않으시겠습니까?"\n아서는 버튼 장치와 봉투를 집어 스튜어드 씨의 손에 밀어 넣었다. 그는 현관으로 걸어가 문을 당겨 열었다.\n"제 명함을 두고 가겠습니다." 스튜어드 씨가 말했다. 그는 문 옆 탁자에 명함을 놓았다.\n그가 떠나자 아서는 그것을 반으로 찢어 조각들을 탁자 위에 던졌다.'},
 {n:'[3]',en:'“What do you think it was?” Norma asked.\n“I don’t care to know,” Arthur answered.\nShe tried to smile but couldn’t. “Aren’t you {curious} at all?”\n“No.” He shook his head.\n“Doesn’t it {intrigue} you?”\n“It {offends|offend} me,” Arthur said.\nNorma sat on her bed and took off her slippers. “Maybe it’s some kind of psychological research.”\nArthur {shrugged|shrug}. “Could be.”\n“Maybe some [[eccentric]] millionaire is doing it.”\n“Maybe.”\n“Wouldn’t you like to know?”\nArthur shook his head.\n“Why?”\n“Because it’s {immoral},” he told her.\nNorma slid beneath the covers. “Well, I think it’s intriguing,” she said.',
  ko:'"그게 뭐였다고 생각해요?" 노마가 물었다.\n"알고 싶지 않아." 아서가 대답했다.\n그녀는 웃으려 했지만 그럴 수 없었다. "조금도 궁금하지 않아요?"\n"응." 그는 고개를 저었다.\n"흥미가 안 생겨요?"\n"불쾌해." 아서가 말했다.\n노마는 침대에 앉아 슬리퍼를 벗었다. "어쩌면 일종의 심리학 연구일지도 몰라요."\n아서는 어깨를 으쓱했다. "그럴 수도 있지."\n"어쩌면 어떤 괴짜 백만장자가 하는 일일지도 몰라요."\n"그럴지도."\n"알고 싶지 않아요?"\n아서는 고개를 저었다.\n"왜요?"\n"부도덕하니까." 그가 그녀에게 말했다.\n노마는 이불 속으로 미끄러져 들어갔다. "글쎄, 난 흥미로운 것 같은데요." 그녀가 말했다.'},
 {n:'[4]',en:'In the morning, as she left the apartment, Norma saw the card halves on the table. {Impulsively|impulsively}, she dropped them into her purse. She locked the front door and joined Arthur in the elevator.\nWhile she was on her coffee break, she took the card halves from her purse and held the torn edges together.\nAfter lunch, she took the card halves from her purse again and Scotch-taped the edges together. “Why am I doing this?” she thought.\nJust before five, she dialed the number.\n“Good afternoon,” said Mr. Steward’s voice.\nNorma almost hung up but {restrained|restrain} herself. She cleared her throat.\n“This is Mrs. Lewis,” she said.\n“Yes, Mrs. Lewis,” Mr. Steward sounded {pleased}.\n“I’m curious.”\n“That’s natural,” Mr. Steward said.\n“Not that I believe a word of what you told us.”\n“Oh, it’s quite {authentic},” Mr. Steward answered.\n“Well, whatever —” Norma {swallowed|swallow}. “When you said someone in the world would die, what did you mean?”\n“Exactly that,” he answered. “It could be anyone. All we {guarantee} is that you don’t know them. And, of course, that you wouldn’t have to watch them die.”\n“For $50,000,” Norma said.\n“That is correct.”\nShe made a {scoffing} sound. “That’s crazy.”\n“{Nonetheless|nonetheless}, that is the {proposition},” Mr. Steward said. “Would you like me to return the button unit?”\nNorma {stiffened|stiffen}. “<i>Certainly not.</i>” She hung up angrily.',
  ko:'아침에 아파트를 나서다가 노마는 탁자 위의 반쪽 난 명함을 보았다. 충동적으로 그녀는 그것을 지갑에 넣었다. 그녀는 현관문을 잠그고 엘리베이터에서 아서와 합류했다.\n커피 휴식 시간에 그녀는 지갑에서 명함 반쪽들을 꺼내 찢어진 가장자리를 맞대어 보았다.\n점심 식사 후, 그녀는 다시 지갑에서 명함 반쪽들을 꺼내 가장자리를 스카치테이프로 붙였다. "내가 왜 이러고 있지?" 그녀는 생각했다.\n5시 직전에 그녀는 그 번호로 전화를 걸었다.\n"안녕하십니까." 스튜어드 씨의 목소리가 말했다.\n노마는 하마터면 전화를 끊을 뻔했지만 자제했다. 그녀는 헛기침을 했다.\n"루이스 부인이에요." 그녀가 말했다.\n"네, 루이스 부인." 스튜어드 씨는 기뻐하는 듯했다.\n"궁금해서요."\n"당연하지요." 스튜어드 씨가 말했다.\n"당신 말을 한마디라도 믿는다는 건 아니에요."\n"아, 그건 정말 진짜입니다." 스튜어드 씨가 대답했다.\n"글쎄, 어쨌든—" 노마는 침을 삼켰다. "세상의 누군가가 죽을 거라고 했을 때, 그게 무슨 뜻이었죠?"\n"말 그대로입니다." 그가 대답했다. "누구든 될 수 있습니다. 저희가 보장하는 것은 당신이 그 사람을 모른다는 것뿐입니다. 그리고 물론, 그 사람이 죽는 것을 지켜볼 필요가 없다는 것도요."\n"5만 달러에요." 노마가 말했다.\n"맞습니다."\n그녀는 코웃음을 쳤다. "말도 안 돼요."\n"그럼에도 불구하고 그것이 제안입니다." 스튜어드 씨가 말했다. "버튼 장치를 돌려드릴까요?"\n노마는 몸이 굳었다. "<i>당연히 아니죠.</i>" 그녀는 화를 내며 전화를 끊었다.'},
 {n:'[5]',en:'The package was lying by the front door; Norma saw it as she left the elevator. She {glared|glare} at the carton as she {unlocked|unlock} the door. I just won’t take it in, she thought. She went inside and started dinner.\nLater, she went into the front hall. Opening the door, she picked up the package and carried it into the kitchen, leaving it on the table. After a while, she put the package in a bottom cabinet. She’d throw it out in the morning.',
  ko:'소포가 현관문 옆에 놓여 있었다. 노마는 엘리베이터에서 내리면서 그것을 보았다. 그녀는 문을 열면서 그 상자를 노려보았다. 그냥 안 들여놓을 거야, 그녀는 생각했다. 그녀는 안으로 들어가 저녁 준비를 시작했다.\n나중에 그녀는 현관으로 갔다. 문을 열고 소포를 집어 부엌으로 가져가 탁자 위에 두었다. 잠시 후 그녀는 소포를 아래쪽 수납장에 넣었다. 아침에 버릴 생각이었다.'},
 {n:'[6]',en:'“Maybe some eccentric millionaire is playing games with people,” she said.\nArthur looked up from his dinner. “I don’t understand you.”\n“What does <i>that</i> mean?”\n“<i>Let it go</i>,” he told her.\nShe put her fork down. “Suppose it’s a genuine offer?” she said.\nArthur {stared|stare} at her. “All right, suppose it is? What would you like to do? Get the button back and push it? <i>{Murder|murder}</i> someone?”\nNorma looked {disgusted}.\n“If you don’t even know the person?” Norma said.\nArthur looked {astounded}. “Are you saying what I think you are?”\n“If it’s some old Chinese {peasant} ten thousand miles away? Some diseased native in the Congo?”\n“How about a baby boy in Pennsylvania?” Arthur {countered|counter}. “Some beautiful little girl on the next block?”\n“Now you’re {loading|load} things.”\n“The point is,” he continued, “what’s the difference whom you kill? It’s still murder.”\n“The point <i>is</i>,” Norma broke in, “if it’s someone you’ve never seen in your life and never will see, someone whose death you don’t even have to <i>know</i> about, you still wouldn’t push the button?”\nArthur stared at her, [[appalled]]. “You mean <i>you would</i>?”\n“<i>Fifty thousand dollars</i>, Arthur,” Norma {interrupted|interrupt}. “A chance to take that trip to Europe we’ve always talked about.”\n“Norma, no.”\n“A chance to buy that {cottage} on the island.”\n“Norma, <i>no</i>.” His face was white.',
  ko:'"어쩌면 어떤 괴짜 백만장자가 사람들을 가지고 장난치는 건지도 몰라요." 그녀가 말했다.\n아서는 저녁 식사를 하다가 고개를 들었다. "당신을 이해할 수가 없군."\n"<i>그게</i> 무슨 뜻이에요?"\n"<i>그만 잊어버려.</i>" 그가 그녀에게 말했다.\n그녀는 포크를 내려놓았다. "만약 그게 진짜 제안이라면요?" 그녀가 말했다.\n아서는 그녀를 빤히 쳐다보았다. "좋아, 진짜라고 치자. 그래서 뭘 하고 싶은데? 버튼을 돌려받아서 누르겠다고? 누군가를 <i>살해</i>하겠다고?"\n노마는 역겨워하는 표정을 지었다.\n"그 사람을 알지도 못한다면요?" 노마가 말했다.\n아서는 몹시 놀란 표정이었다. "지금 내가 생각하는 그 말을 하는 거야?"\n"만약 그게 만 마일 떨어진 어느 늙은 중국 농부라면요? 콩고의 어느 병든 원주민이라면요?"\n"펜실베이니아의 갓난 남자아이라면?" 아서가 반박했다. "옆 블록의 예쁜 어린 여자아이라면?"\n"이제 감정에 호소하는군요."\n"요점은," 그가 계속했다. "누구를 죽이든 무슨 차이가 있느냐는 거야. 그래도 살인이야."\n"요점은 <i>말이죠</i>," 노마가 끼어들었다. "평생 본 적도 없고 앞으로도 절대 볼 일 없는 사람, 그 사람의 죽음에 대해 <i>알</i> 필요조차 없는 사람이라도, 당신은 여전히 버튼을 누르지 않겠다는 거예요?"\n아서는 간담이 서늘해져 그녀를 빤히 쳐다보았다. "그러니까 <i>당신은 누르겠다는</i> 거야?"\n"<i>5만 달러</i>예요, 아서." 노마가 말을 끊었다. "우리가 늘 이야기하던 유럽 여행을 갈 기회라고요."\n"노마, 안 돼."\n"섬에 있는 그 작은 집을 살 기회예요."\n"노마, <i>안 돼</i>." 그의 얼굴은 하얗게 질려 있었다.'},
 {n:'[7]',en:'While she was stacking dishes, she turned {abruptly}, dried her hands, and took the package from the bottom cabinet. Opening it, she set the button unit on the table. She stared at it for a long time before taking the key from its envelope and removing the glass dome. She stared at the button. How ridiculous, she thought. All this [[furor]] over a meaningless button.\nReaching out, she pressed it down. For <i>us</i>, she thought angrily.\nShe shuddered. Was it <i>happening</i>? A chill of horror swept across her.\nIn a moment, it had passed. She made a contemptuous noise. <i>Ridiculous</i>, she thought. To get so worked up over nothing.\nShe threw the button unit, dome, and key into the wastebasket and hurried to dress for work.',
  ko:'설거지한 접시를 쌓다가 그녀는 갑자기 몸을 돌려 손을 닦고 아래쪽 수납장에서 소포를 꺼냈다. 그것을 열어 버튼 장치를 탁자 위에 놓았다. 그녀는 한참 동안 그것을 바라본 뒤 봉투에서 열쇠를 꺼내 유리 덮개를 벗겼다. 그녀는 버튼을 응시했다. 정말 어처구니없군, 그녀는 생각했다. 의미 없는 버튼 하나로 이 모든 소동이라니.\n손을 뻗어 그녀는 버튼을 눌렀다. <i>우리</i>를 위해서야, 그녀는 화가 나서 생각했다.\n그녀는 몸서리쳤다. 일이 <i>벌어지고 있는</i> 걸까? 공포의 오한이 그녀를 휩쓸고 지나갔다.\n잠시 후 그 느낌은 지나갔다. 그녀는 경멸하는 듯한 소리를 냈다. <i>어처구니없어</i>, 그녀는 생각했다. 아무것도 아닌 일에 그렇게 흥분하다니.\n그녀는 버튼 장치와 덮개, 열쇠를 쓰레기통에 던져 넣고 출근 준비를 하러 서둘러 갔다.'},
 {n:'[8]',en:'She had just turned over the supper steaks when the telephone rang. She picked up the receiver. “Hello?”\n“Mrs. Lewis?”\n“Yes?”\n“This is the Lenox Hill Hospital.”\nShe felt unreal as the voice informed her of the subway accident — the crowd pushing each other, Arthur pushed from the platform in front of the train. She was {conscious} of shaking her head but couldn’t stop.\nAs she hung up, she remembered Arthur’s life-insurance policy for $25,000, with [[double indemnity]] for —\n“<i>No.</i>” She couldn’t seem to breathe. She struggled to her feet and walked into the kitchen {numbly}. Something cold pressed at her skull as she removed the button unit from the wastebasket.\nAbruptly, she began to smash it on the sink edge, {pounding|pound} it harder and harder, until the wood split. She pulled the sides apart, cutting her fingers without noticing. There were no transistors in the box, no wires or tubes.\nThe box was empty.\nShe {whirled with a gasp|whirl with a gasp} as the telephone rang. {Stumbling|stumble} into the living room, she picked up the receiver.\n“Mrs. Lewis?” Mr. Steward asked.\nIt wasn’t her voice [[shrieking]] so; it couldn’t be. “<i>You said I wouldn’t know the one that died!</i>”\n“My dear lady,” Mr. Steward said. “Do you really think you knew your husband?”',
  ko:'그녀가 저녁용 스테이크를 막 뒤집었을 때 전화가 울렸다. 그녀는 수화기를 들었다. "여보세요?"\n"루이스 부인이십니까?"\n"네?"\n"레녹스 힐 병원입니다."\n그 목소리가 지하철 사고에 대해 알려 주는 동안 그녀는 현실이 아닌 것 같았다. 군중이 서로 밀쳤고, 아서가 승강장에서 열차 앞으로 떠밀렸다는 것이었다. 그녀는 자신이 고개를 젓고 있다는 것을 의식했지만 멈출 수가 없었다.\n전화를 끊으면서 그녀는 아서의 2만 5천 달러짜리 생명 보험 증서를 떠올렸다. 배액 보상 조건이 붙은—\n"<i>안 돼.</i>" 그녀는 숨을 쉴 수 없을 것 같았다. 그녀는 간신히 일어나 멍하니 부엌으로 걸어갔다. 쓰레기통에서 버튼 장치를 꺼낼 때 무언가 차가운 것이 그녀의 두개골을 짓누르는 듯했다.\n갑자기 그녀는 그것을 싱크대 모서리에 내리치기 시작했고, 나무가 쪼개질 때까지 점점 더 세게 두드렸다. 그녀는 옆면을 뜯어냈고, 손가락이 베이는 것도 알아차리지 못했다. 상자 안에는 트랜지스터도, 전선이나 진공관도 없었다.\n상자는 비어 있었다.\n전화가 울리자 그녀는 헉 하며 홱 돌아섰다. 비틀거리며 거실로 가서 그녀는 수화기를 들었다.\n"루이스 부인?" 스튜어드 씨가 물었다.\n그렇게 악을 쓰는 것은 그녀의 목소리가 아니었다. 그럴 리가 없었다. "<i>죽는 사람이 내가 모르는 사람일 거라고 했잖아요!</i>"\n"부인," 스튜어드 씨가 말했다. "정말 남편을 알고 있었다고 생각하십니까?"'}
],
gloss:{'eccentric':'괴짜인, 별난','appalled':'간담이 서늘한, 끔찍해 하는','furor':'소동','double indemnity':'보험금 배액 보상','shrieking':'악을 쓰는'},
vocab:[

 ['[4]',[['impulsively','충동적으로'],['restrain','자제하다, 억제하다'],['pleased','기뻐하는, 만족해하는'],['authentic','진짜의, 진짜인'],['swallow','(침을) 삼키다'],['guarantee','보장하다'],['scoffing','비웃는, 조롱하는'],['nonetheless','그럼에도 불구하고'],['proposition','제안'],['stiffen','(몸이) 굳어지다, 경직되다']]],

]

Object.assign(R.find(r=>r.id==='r3'),{
flowTitle:'이야기는 네 단계로 흘러간다',
flowNote:'소설은 <b>제안 → 유혹 → 선택 → 반전</b> 구조다. 순서·삽입 문제는 장면 전환과 인물의 반응을, 서술형은 인물의 태도 차이와 결말의 의미를 묻는다.',
flow:[['[1]–[2]','제안','버튼 장치 도착. 스튜어드 씨: "누르면 모르는 누군가가 죽고, 5만 달러를 받는다." 아서는 거절'],['[3]–[4]','유혹','노마는 호기심을 느끼고, 몰래 명함을 붙여 전화. "당신이 모르는 사람"이라는 보장'],['[5]–[7]','선택','아서와 논쟁 후, 노마가 혼자 버튼을 누름'],['[8]','반전','아서가 지하철 사고로 사망. 상자는 비어 있었다. "남편을 정말 알았다고 생각하나요?"',1]],
chain:{title:'인물 대조: 아서 vs 노마',sep:'vs',items:['아서: 불쾌함(offends), 부도덕(immoral), "그래도 살인이야"','노마: 호기심(curious), 흥미(intriguing), "모르는 사람이라면?"'],note:'핵심 아이러니: 스튜어드 씨는 "<b>당신이 모르는 사람</b>"이 죽는다고 약속했다. 죽은 사람은 남편 아서였고, 그는 "남편을 정말 알았다고 생각하나요?"라고 되묻는다. 노마가 노린 5만 달러보다 아서의 생명 보험(2만 5천 달러 × 배액 보상 = 5만 달러)이 더 소름 끼치는 연결 고리다. 빈 상자는 버튼이 기계가 아니라 <b>선택</b>의 문제였음을 보여 준다.'},
notes:[
 ['[1]','소포 도착','현관 앞의 소포, 유리 덮개로 잠긴 버튼 장치, "스튜어드 씨가 오후 8시에 방문"이라는 쪽지.',['<em>a cube-shaped carton sealed with tape, their name and address printed by hand</em>: 과거분사 수식 + 독립분사구문(their name and address (being) printed).','<em>Inside the carton was a push-button unit fastened to…</em>: 장소 부사구 도치 → 주어 a push-button unit(단수) → was.','<em>it was locked in place</em>: 제자리에 고정되어 있었다.','<em>call on</em> + 사람: ~를 방문하다.']],
 ['[2]','제안','스튜어드 씨가 제안을 설명하고, 아서는 장난이라 여기며 내쫓는다. 명함은 반으로 찢긴다.',['<em>Norma repressed a smile. She was sure now it was a sales pitch.</em>: 처음엔 판매 권유로 오해.','<em>someone you don’t know will die. In return, you will receive…</em>: 목적격 관계대명사 생략, in return = 그 대가로.','<em>Is this a practical joke?</em>: 짓궂은 장난.','<em>you’d better leave</em>: had better 동사원형.','<em>Are you sure you wouldn’t care to think about it…?</em>: care to v = ~하고 싶어 하다.','<em>thrust them into Mr. Steward’s hands</em> / <em>tore it in half</em>: 아서의 단호한 거절을 보여 주는 행동.']],
 ['[3]','태도 차이','그날 밤, 노마는 궁금해하고 아서는 불쾌해한다. 인물 대조가 가장 분명한 문단.',['<em>I don’t care to know.</em>: 알고 싶지 않다.','<em>Doesn’t it intrigue you?</em> / <em>It offends me.</em>: 감정 동사 → 사물 주어 + 사람 목적어.','<em>Maybe some eccentric millionaire is doing it.</em>','<em>Because it’s immoral</em> ↔ <em>I think it’s intriguing</em>: 두 사람 태도의 결정적 대비.']],
 ['[4]','전화','노마는 충동적으로 찢긴 명함을 챙겨 테이프로 붙이고 전화한다. 스튜어드 씨는 "당신이 모르는 사람"과 "죽는 것을 볼 필요 없음"을 보장한다.',['<em>Impulsively, she dropped them into her purse.</em>: 충동적 행동 → 숨겨진 관심.','<em>Norma almost hung up but restrained herself.</em>: 재귀대명사.','<em>Not that I believe a word of what you told us.</em>: 그렇다고 ~라는 건 아니다.','<em>All we guarantee <b>is</b> that you don’t know them.</em>: All (that) we guarantee는 단수 취급.','<em>Would you like me to return the button unit?</em>: would like O to-v.','<em>Certainly not.</em>: 겉으로는 단호하지만 이후 행동과 대비된다.']],
 ['[5]','소포 재등장','버튼 장치가 다시 현관에 놓여 있다. 노마는 들이지 않겠다면서도 결국 부엌으로 가져가 수납장에 넣는다.',['<em>I just won’t take it in, she thought.</em>: 속마음 (자유 간접 화법).','<em>Opening the door, she picked up the package…, leaving it on the table.</em>: 분사구문 두 개 (동시 동작·연속 동작).','<em>She’d throw it out in the morning.</em>: 미루는 행동 = 갈등.']],
 ['[6]','논쟁','저녁 식탁. 노마는 "모르는 사람이라면?"으로 정당화하고, 아서는 "누구를 죽이든 살인"이라며 경악한다.',['<em>Suppose it’s a genuine offer?</em>: Suppose = 만약 ~라면.','<em>If it’s some old Chinese peasant ten thousand miles away?</em>: 멀고 모르는 사람 → 죄책감 축소 논리.','<em>How about a baby boy in Pennsylvania?</em>: 아서의 반박(counter) → 가깝고 구체적인 피해자.','<em>what’s the difference whom you kill? It’s still murder.</em>: 아서의 핵심 논리.','<em>someone whose death you don’t even have to know about</em>: 소유격 관계대명사 whose.','<em>A chance to take that trip to Europe… / to buy that cottage…</em>: 노마의 욕망.']],
 ['[7]','선택','다음 날 아침, 노마는 버튼을 누른다. 잠깐 공포를 느끼지만 "말도 안 돼"라며 버리고 출근한다.',['<em>Opening it, she set the button unit on the table.</em> / <em>Reaching out, she pressed it down.</em>: 분사구문.','<em>before taking the key</em>: 전치사 + 동명사.','<em>All this furor over a meaningless button.</em>','<em>For <i>us</i>, she thought angrily.</em>: 자기 합리화.','<em>A chill of horror swept across her.</em> → <em>She made a contemptuous noise.</em>: 공포 → 경멸로 감정 변화.']],

 {q:'[6] 21. At dinner, why did Norma think pressing the button might not be murder? Do you agree with her? Why or why not?',ko:'저녁 식사 중에 노마는 왜 버튼을 누르는 것이 살인이 아닐 수도 있다고 생각했나? 여러분은 노마의 생각에 동의하는가? 왜 그런지 또는 왜 그렇지 않은지 설명해 보시오.',model:'She thought it might not be murder because the victim would be a stranger she had never seen and would never know about. (예시 의견) I disagree, because causing someone’s death for money is still murder, whether or not you know the person.',tip:'세 부분: 노마의 이유 + 동의 여부 + 그 이유. 의견은 자유지만 근거를 꼭 쓴다.'},

paras:[
 {n:'[1]',en:'Modern {archeologists|archeologist} have often found something unexpected among the {artifacts|artifact} of {ancient} Egyptian tombs: pots of honey, thousands of years old, and yet still {preserved|preserve}. Even after {millennia|millennium}, the food remains {unspoiled}, clear evidence of the long {shelf life} of honey. There are a few other foods that keep {indefinitely} in their {raw state}, such as salt, sugar, and dried rice. But there’s something special about honey. It can remain preserved in a completely {edible} form. One could {dip into} a thousand-year-old jar of honey and enjoy it, without {preparation}, as if it were a day old. This raises the question: what exactly makes honey such a special food? The answer is as complex as honey’s flavor — you don’t get a food source with no {expiration date} without many different factors working in perfect {harmony}.',
  ko:'현대의 고고학자들은 고대 이집트 무덤의 유물들 가운데서 종종 예상치 못한 것을 발견해 왔다. 바로 수천 년이 되었는데도 여전히 보존된 꿀 단지이다. 수천 년이 지난 후에도 그 음식은 상하지 않은 채로 남아 있는데, 이는 꿀의 보존 기간이 길다는 명백한 증거이다. 소금, 설탕, 말린 쌀처럼 가공하지 않은 상태로 무기한 보관되는 음식이 몇 가지 더 있다. 하지만 꿀에는 특별한 무언가가 있다. 꿀은 완전히 먹을 수 있는 형태로 보존된 채 남아 있을 수 있다. 천 년 된 꿀 단지에서 꿀을 떠서, 아무 준비 없이 마치 하루 된 것처럼 즐길 수 있다. 이것은 다음과 같은 질문을 제기한다. 정확히 무엇이 꿀을 그토록 특별한 음식으로 만드는가? 그 답은 꿀의 맛만큼이나 복잡하다. 여러 가지 요인들이 완벽한 조화를 이루어 작용하지 않는다면 유통기한이 없는 식품은 얻을 수 없다.'},
 {n:'[2]',en:'The first reason comes from the chemical {make-up} of honey itself. Honey is, {first and foremost}, a sugar. Honey contains very little water in its natural state, and sugars are [[hygroscopic]], meaning that they can easily {absorb} {moisture} if left {unsealed}. As Amina Harris of the Honey and Pollination Center explains, “Honey in its natural form is very low moisture. Very few bacteria or {microorganisms|microorganism} can survive in an environment like that.” This low moisture is an important feature of honey’s {longevity}: for honey to {spoil}, there needs to be something inside of it that can spoil. With so little water, microorganisms cannot survive long enough to spoil the honey. Honey is also naturally very {acidic}, with a pH between about 3 and 4.5. This acidity kills off almost anything that wants to grow there. So bacteria and other microorganisms must look elsewhere for a home — the {life expectancy} inside of honey is just too low.',
  ko:'첫 번째 이유는 꿀 자체의 화학적 구성에서 비롯된다. 꿀은 무엇보다도 당이다. 꿀은 자연 상태에서 물을 매우 적게 함유하고 있으며, 당분은 흡습성이 있는데, 이는 밀봉되지 않은 채로 남겨지면 수분을 쉽게 흡수할 수 있다는 의미이다. 꿀·수분 매개 센터의 아미나 해리스가 설명하듯이, "자연 상태의 꿀은 수분이 매우 적습니다. 그런 환경에서 살아남을 수 있는 박테리아나 미생물은 거의 없습니다." 이 낮은 수분은 꿀의 긴 보존성의 중요한 특징이다. 꿀이 상하려면 그 안에 상할 수 있는 무언가가 있어야 한다. 물이 너무 적어서 미생물은 꿀을 상하게 할 만큼 오래 살아남을 수 없다. 꿀은 또한 pH가 약 3에서 4.5 사이로 자연적으로 매우 산성이다. 이 산성은 그곳에서 자라려는 거의 모든 것을 죽인다. 그래서 박테리아와 다른 미생물들은 다른 곳에서 보금자리를 찾아야 한다. 꿀 속에서의 기대 수명이 너무 낮기 때문이다.'},
 {n:'[3]',en:'But honey isn’t the only hygroscopic food source. [[Molasses|molasses]], a {byproduct} of {cane sugar} production, is also highly hygroscopic and acidic, though less so than honey. Yet, although it may take a long time, molasses will eventually spoil. So why does one sugar {solution} spoil, while another {lasts|last} indefinitely? Enter bees. {Nectar|nectar}, the first material collected by bees to make honey, contains a lot of water. But in the process of making honey, bees remove much of this moisture by {flapping|flap} their wings to dry out the nectar. The chemical make-up of a bee’s stomach also plays an important role in honey’s longevity. Bees have an {enzyme} in their stomachs called [[glucose oxidase]]. When bees [[regurgitate]] the nectar from their mouths into the {honeycomb}, this enzyme mixes with the nectar and {breaks it down|break down} into two by-products: {gluconic acid} and [[hydrogen peroxide]]. Hydrogen peroxide then goes to work against all these other bad things that could possibly grow.',
  ko:'하지만 흡습성이 있는 식품이 꿀만 있는 것은 아니다. 사탕수수 설탕 생산의 부산물인 당밀 역시 꿀보다는 덜하지만 흡습성과 산성이 매우 강하다. 그러나 오랜 시간이 걸릴 수는 있어도 당밀은 결국 상한다. 그렇다면 왜 어떤 당 용액은 상하고 다른 당 용액은 무기한 지속되는 것일까? 여기서 벌이 등장한다. 벌이 꿀을 만들기 위해 처음 모으는 재료인 꽃꿀은 물을 많이 함유하고 있다. 하지만 꿀을 만드는 과정에서 벌은 날개를 퍼덕여 꽃꿀을 말림으로써 이 수분의 상당 부분을 제거한다. 벌의 위의 화학적 구성 또한 꿀의 긴 보존성에 중요한 역할을 한다. 벌의 위에는 포도당 산화효소라는 효소가 있다. 벌이 꽃꿀을 입에서 벌집으로 역류시킬 때, 이 효소가 꽃꿀과 섞여 그것을 글루콘산과 과산화수소라는 두 가지 부산물로 분해한다. 그런 다음 과산화수소는 자랄 가능성이 있는 다른 모든 해로운 것들에 맞서 작용한다.'},
 {n:'[4]',en:'For this reason, honey has been used for centuries as a {medicinal remedy}. Because it is thick, prevents the growth of microorganisms, and contains hydrogen peroxide, it creates an effective {barrier against} {infection} in {wounds|wound}. The earliest recorded use of honey for medicinal purposes comes from Sumerian {clay tablets|clay tablet}, and the ancient Egyptians used honey in {ointments|ointment} to treat skin and eye diseases. As Harris explains, honey acted as “a natural {bandage}” because almost nothing could grow on it. What’s more, when honey isn’t {sealed|seal} in a jar, it absorbs moisture. When applied to a wound, it draws out water and {releases|release} a small amount of hydrogen peroxide, which helps prevent infection and promotes healing. Honey is still used for medical purposes today, including in honey-covered bandages used to treat wounds.',
  ko:'이런 이유로 꿀은 수 세기 동안 치료제로 사용되어 왔다. 꿀은 걸쭉하고, 미생물의 증식을 막으며, 과산화수소를 함유하고 있기 때문에 상처의 감염을 막는 효과적인 장벽을 만든다. 의학적 목적으로 꿀을 사용한 가장 오래된 기록은 수메르의 점토판에서 나오며, 고대 이집트인들은 피부병과 눈병을 치료하기 위해 연고에 꿀을 사용했다. 해리스가 설명하듯이, 꿀 위에서는 거의 아무것도 자랄 수 없었기 때문에 꿀은 "천연 붕대" 역할을 했다. 게다가 꿀은 단지 안에 밀봉되어 있지 않으면 수분을 흡수한다. 상처에 바르면 꿀은 수분을 빨아내고 소량의 과산화수소를 방출하는데, 이는 감염을 예방하고 치유를 촉진하는 데 도움이 된다. 꿀은 오늘날에도 상처를 치료하는 데 쓰이는 꿀 코팅 붕대를 포함하여 의학적 목적으로 여전히 사용되고 있다.'},
 {n:'[5]',en:'A jar of honey’s seal, it {turns out|turn out}, is the final factor that is key to honey’s long shelf life, as shown by the millennia-old Egyptian honey. While honey is certainly a super-food, it isn’t {supernatural}. If you leave it unsealed in a {humid} environment, it can absorb water and {eventually} spoil. As Harris explains, “As long as the {lid} stays on it and no water is added to it, honey will not go bad.” So if you’re interested in keeping honey for hundreds of years, do what the bees do and keep it sealed — a hard thing to do with this delicious treat!',
  ko:'밝혀진 바에 따르면, 꿀단지의 밀봉이 꿀의 긴 보존 기간의 핵심이 되는 마지막 요인인데, 이는 수천 년 된 이집트 꿀이 보여 주는 바와 같다. 꿀은 분명 슈퍼푸드이지만 초자연적인 것은 아니다. 습한 환경에서 밀봉하지 않은 채로 두면 꿀은 수분을 흡수하여 결국 상할 수 있다. 해리스가 설명하듯이, "뚜껑이 닫혀 있고 물이 더해지지 않는 한 꿀은 상하지 않습니다." 그러니 꿀을 수백 년 동안 보관하고 싶다면, 벌이 하는 대로 밀봉해 두라. 이 맛있는 간식을 두고 그러기는 어렵겠지만!'}
],

flowNote:'[1]에서 "무엇이 꿀을 특별하게 만드는가?"라는 질문을 던지고, [2]·[3]·[5]에서 <b>세 가지 요인</b>(화학적 구성, 벌, 밀봉)으로 답한다. [4]는 같은 성질의 <b>활용</b>(치료제)이다. 요인의 순서(first reason → bees → final factor)가 순서·삽입 문제의 단서다.',
flow:[['[1]','질문 제기','수천 년 된 이집트 꿀. 왜 꿀은 상하지 않을까?'],['[2]','요인 ① 화학적 구성','수분이 적고(흡습성), 강한 산성(pH 3~4.5) → 미생물 생존 불가'],['[3]','요인 ② 벌','날갯짓으로 수분 제거 + 위의 효소 → 과산화수소 생성'],['[4]','활용','상처 치료제, "천연 붕대"'],['[5]','요인 ③ 밀봉','마지막 요인. 뚜껑을 닫고 물이 안 들어가면 상하지 않음',1]],

notes:[
 ['[1]','질문 제기','고대 이집트 무덤에서 발견된 꿀은 수천 년이 지나도 상하지 않았다. 무엇이 꿀을 특별하게 만드는가?',['<em>found something unexpected</em>: -thing + 형용사 (후치 수식).','<em>the food remains unspoiled</em>: remain + 형용사 보어.','<em>a few other foods that keep indefinitely</em>: keep(자동사) = 상하지 않고 유지되다.','<em>enjoy it, without preparation, as if it <b>were</b> a day old</em>: as if + 가정법 과거.','<em>The answer is as complex as honey’s flavor</em>: 원급 비교.','<em>you don’t get A without many different factors working…</em>: without + 명사 + v-ing, 이중 부정 = 여러 요인이 작용해야만 얻을 수 있다.']],
 ['[2]','화학적 구성','꿀은 당이며, 수분이 매우 적고 강한 산성이라 미생물이 살아남을 수 없다.',['<em>Honey is, <b>first and foremost</b>, a sugar.</em>: 무엇보다도.','<em>sugars are hygroscopic, <b>meaning</b> that they can easily absorb moisture if (they are) <b>left</b> unsealed</em>: 분사구문 + if 뒤 주어·be동사 생략, leave O p.p.','<em><b>Very few</b> bacteria … can survive</em>: few = 거의 없는 (부정).','<em><b>for honey to spoil</b>, there needs to be something…</em>: for + 의미상 주어 + to부정사.','<em>cannot survive <b>long enough to</b> spoil the honey</em>: 형용사/부사 + enough to (어순 주의: enough long ✗).','<em>the life expectancy inside of honey is just too low</em>: 미생물 입장에서의 ‘기대 수명’.']],
 ['[3]','벌의 역할','당밀도 흡습성·산성이지만 결국 상한다. 차이는 벌이다. 벌은 날갯짓으로 수분을 없애고, 위의 효소로 과산화수소를 만든다.',['<em>Molasses, a byproduct of cane sugar production, <b>is</b> also…</em>: 동격 삽입, 주어 molasses는 단수 취급.','<em>though less so than honey</em>: so = hygroscopic and acidic.','<em>why does one sugar solution spoil, while another lasts indefinitely?</em>: one ~ another, last = 지속되다.','<em>Enter bees.</em>: ‘벌이 등장한다’ (무대 지시문 표현).','<em>Nectar, the first material collected by bees…, <b>contains</b>…</em>: 동격 + 과거분사, 동사는 단수.','<em>by flapping their wings to dry out the nectar</em>: by v-ing (수단) + 목적의 to부정사.','<em>an enzyme … <b>called</b> glucose oxidase</em>: 과거분사 후치 수식.','<em>breaks <b>it</b> down into</em>: 대명사 목적어는 이어동사 사이에 (break down it ✗).']],
 ['[4]','치료제','같은 성질 덕분에 꿀은 수 세기 동안 상처 치료에 쓰였다. 수분을 빨아내고 과산화수소를 방출한다.',['<em>has been used for centuries as a medicinal remedy</em>: 현재완료 수동태.','<em>Because it is thick, prevents …, and contains …</em>: 동사 3개 병렬.','<em>The earliest recorded use of honey … <b>comes</b> from…</em>: 주어 use(단수).','<em>What’s more</em>: 게다가.','<em>When (it is) applied to a wound</em>: 접속사 뒤 주어·be동사 생략.','<em>releases … hydrogen peroxide, which helps prevent infection and promotes healing</em>: 계속적 which, help (to) v.']],

<script>
const K=['①','②','③','④','⑤'],AB=['A','B','C','D'];
const $=(s,el=document)=>el.querySelector(s),$$=(s,el=document)=>[...el.querySelectorAll(s)];
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const norm=s=>s.toLowerCase().replace(/[‘’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const words=s=>norm(s).split(' ').filter(Boolean);
let store={};try{store=JSON.parse(localStorage.getItem('eng3q')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('eng3q',JSON.stringify(store))}catch(e){}};

function markup(text,dict){
  const one=s=>s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,t,k)=>{k=(k||t).toLowerCase();return `<span class="hl g" tabindex="0" data-k="${k}">${t}</span>`})
   .replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,t,k)=>{k=(k||t).toLowerCase();if(!dict[k])console.warn('no vocab',k);return `<span class="hl v" tabindex="0" data-k="${k}">${t}</span>`});
  return text.split('\n').map(l=>`<p>${one(l)}</p>`).join('');
}
function checkFn(spec,w){
  if(spec==='#one')return a=>{const t=a.trim();return t.length>0&&(t.match(/[.!?]/g)||[]).length===1&&/[.!?]$/.test(t)};
  if(spec==='#two')return a=>{const t=a.trim();return (t.match(/[.!?]/g)||[]).length===2&&/[.!?]$/.test(t)};
  if(spec==='#bank')return a=>w.bank.every(c=>(' '+norm(a)+' ').includes(' '+norm(c)+' '));
  const m=spec.match(/^#w(\d+)-(\d+)$/);if(m)return a=>{const n=words(a).length;return n>=+m[1]&&n<=+m[2]};
  if(spec[0]==='!'){const re=new RegExp(spec.slice(1));return a=>!re.test(norm(a))}
  const re=new RegExp(spec);return a=>re.test(norm(a));
}
function mcBlock(list,scoreEl,prefix){
  const wrap=h('div','qlist');let correct=0,answered=0;
  list.forEach((q,i)=>{
    const d=h('div','q',`<div class="qhead"><span class="num">${prefix}${i+1}</span><span class="type">${q.type}</span></div><p><b>${q.prompt}</b></p><div class="passage">${q.passage}</div><div class="opts"></div><p class="explain" hidden></p>`);
    const o=$('.opts',d);
    q.opts.forEach((t,j)=>{
      const b=h('button','opt',t===K[j]?`<span>${t}</span>`:`<span class="k">${K[j]}</span><span>${t}</span>`);
      b.onclick=()=>{
        $$('.opt',o).forEach((x,k)=>{x.disabled=true;if(k===q.ans)x.classList.add('right')});
        if(j!==q.ans)b.classList.add('wrong');else correct++;answered++;
        const e=$('.explain',d);e.innerHTML=(j===q.ans?'<b>정답!</b> ':'<b>정답은 '+K[q.ans]+'.</b> ')+q.ex;e.hidden=false;
        scoreEl.querySelector('b').textContent=`${correct} / ${list.length}`;scoreEl.querySelector('.muted').textContent=`${answered}문항 풀이`;
      };o.appendChild(b);
    });
    wrap.appendChild(d);
  });
  return wrap;
}
function wrBlock(list){
  const wrap=h('div','qlist');
  list.forEach((w,i)=>{
    const fns=w.checks.map(c=>checkFn(c[1],w));
    const d=h('div','q',`<div class="qhead"><span class="num">서술형 ${i+1}</span><span class="type">${w.title}</span></div>
    <p><b>${w.prompt||'우리말과 같은 뜻이 되도록 빈칸을 완성하시오.'}</b></p>
    ${w.bank?`<div class="bank">${w.bank.map(b=>`<span>${b}</span>`).join('')}</div>`:''}
    ${w.stem?`<div class="passage">${w.stem}<span class="box ko">${w.ko}</span></div>`:(w.ko?`<div class="passage ko">${w.ko}</div>`:'')}
    <p class="hint"><b>힌트</b> ${w.hint}</p>
    <textarea placeholder="${w.stem?'빈칸에 들어갈 부분만 입력':'답안을 입력'}…"></textarea>
    <ul class="checks">${w.checks.map(c=>`<li>${c[0]}</li>`).join('')}</ul>
    <button class="ghost">모범 답안 보기</button><div class="model" hidden><span>${w.model}</span></div>`);
    const ta=$('textarea',d),lis=$$('.checks li',d);
    ta.addEventListener('input',()=>{const v=ta.value;fns.forEach((f,k)=>{lis[k].className=v.trim()?(f(v)?'ok':'no'):''})});
    $('.ghost',d).onclick=e=>{const m=$('.model',d);m.hidden=!m.hidden;e.target.textContent=m.hidden?'모범 답안 보기':'모범 답안 숨기기'};
    wrap.appendChild(d);
  });
  return wrap;
}

function build(r){
  const dict={};r.vocab.forEach(([,l])=>l.forEach(([w,m])=>dict[w.toLowerCase()]=m));Object.entries(r.gloss).forEach(([k,m])=>dict[k]=m);
  r.dict=dict;
  const root=h('div','rview');root.dataset.r=r.id;root.hidden=true;
  /* ---- 본문 ---- */
  const vt=h('div','view');vt.dataset.t='text';
  const sec=h('section');
  const hasG=Object.keys(r.gloss).length>0;
  sec.innerHTML=`<div class="texthead"><div style="display:grid;gap:4px"><span class="eyebrow">원문 · Reading ${r.num}</span><h2 style="font-size:22px">${r.title}</h2><p class="muted" style="font-size:13px">${r.source}</p></div>
   <div class="ctrls"><button class="ghost tr-all">전체 해석 보기</button><button class="ghost hl-toggle on">하이라이트 켜짐</button></div></div>
   <div class="legend"><span><span class="hl v">어휘</span> 단어장 어휘</span>${hasG?'<span><span class="hl g">어휘</span> 본문 주석(★) 어휘</span>':''}<span>· 단어를 누르면 뜻, 문단 번호를 누르면 해석</span></div>`;
  const rd=h('div','panel reading'+(r.story?' story':''));
  r.paras.forEach(p=>{
    if(p.h){rd.appendChild(h('h3','subhead',p.h));return}
    const d=h('div','rp',`<button class="pn" aria-expanded="false" title="해석 보기">${p.n}</button><div><div class="rtext">${markup(p.en,dict)}</div><div class="tr" hidden>${p.ko.split('\n').map(l=>`<p>${l}</p>`).join('')}</div></div>`);
    const b=$('.pn',d),t=$('.tr',d);b.onclick=()=>{t.hidden=!t.hidden;b.setAttribute('aria-expanded',!t.hidden)};
    rd.appendChild(d);
  });
  sec.appendChild(rd);
  let allOn=false;$('.tr-all',sec).onclick=e=>{allOn=!allOn;$$('.rp',rd).forEach(d=>{$('.tr',d).hidden=!allOn;$('.pn',d).setAttribute('aria-expanded',allOn)});e.target.textContent=allOn?'전체 해석 숨기기':'전체 해석 보기';e.target.classList.toggle('on',allOn)};
  $('.hl-toggle',sec).onclick=e=>{const off=rd.classList.toggle('plain');e.target.textContent=off?'하이라이트 꺼짐':'하이라이트 켜짐';e.target.classList.toggle('on',!off)};
  vt.appendChild(sec);
  // vocab
  const vs=h('section',null,`<span class="eyebrow">단어장</span><h2>문단별 핵심 어휘</h2>`);
  const vg=h('div','vocab');
  r.vocab.forEach(([n,l])=>vg.appendChild(h('div','vgroup',`<span class="vn">${n}</span><dl>${l.map(([w,m])=>`<div><dt>${w}</dt><dd>${m}</dd></div>`).join('')}</dl>`)));
  if(hasG)vg.appendChild(h('div','vgroup gl',`<span class="vn">★ 본문 주석 어휘</span><dl>${Object.entries(r.gloss).map(([w,m])=>`<div><dt>${w}</dt><dd>${m}</dd></div>`).join('')}</dl>`));
  vs.appendChild(vg);vt.appendChild(vs);
  // struct
  if(r.struct){
    const ss=h('section',null,`<span class="eyebrow">구조 정리</span><h2>글 구조 정리표</h2><p class="muted" style="font-size:14px">빈칸을 먼저 떠올려 본 뒤 눌러서 확인하자.</p>`);
    const fill=s=>s.replace(/\{\{([^}]+)\}\}/g,'<button class="blank">$1</button>');
    const tb=h('div','panel',`<table class="struct"><thead><tr>${r.struct.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.struct.rows.map(row=>`<tr>${row.map(c=>`<td>${fill(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    tb.style.padding='0';tb.style.overflow='hidden';ss.appendChild(tb);
    const bl=$$('.blank',tb);bl.forEach(b=>b.onclick=()=>b.classList.toggle('show'));
    const ab=h('button','ghost','빈칸 모두 보기');let bOn=false;ab.onclick=()=>{bOn=!bOn;bl.forEach(b=>b.classList.toggle('show',bOn));ab.textContent=bOn?'빈칸 모두 가리기':'빈칸 모두 보기'};
    ss.appendChild(ab);vt.appendChild(ss);
  }
  // book questions
  if(r.bookQs){
    const bs=h('section',null,`<span class="eyebrow">학습지 문제</span><h2>내용 이해 문제 (1–27)</h2><p class="muted" style="font-size:14px">객관식은 누르면 바로 채점된다. 서술형은 직접 써 본 뒤 예시 답안과 비교하자.</p>`);
    const ql=h('div','qlist');
    r.bookQs.forEach(q=>{
      const d=h('div','q',`<p class="en"><b>${q.q}</b></p>${q.ko?`<p class="ko">${q.ko}</p>`:''}`);
      if(q.opts){
        const o=h('div','opts');
        q.opts.forEach((t,j)=>{const b=h('button','opt',`<span class="k">${AB[j]})</span><span>${t}</span>`);b.onclick=()=>{$$('.opt',o).forEach((x,k)=>{x.disabled=true;if(k===q.ans)x.classList.add('right')});if(j!==q.ans)b.classList.add('wrong')};o.appendChild(b)});
        d.appendChild(o);
      }else{
        d.appendChild(h('textarea'));d.lastChild.placeholder='영어로 답을 써 보자…';
        const g=h('button','ghost','예시 답안 보기'),m=h('div','model',`<span>${q.model}</span><span class="tip">${q.tip}</span>`);m.hidden=true;
        g.onclick=()=>{m.hidden=!m.hidden;g.textContent=m.hidden?'예시 답안 보기':'예시 답안 숨기기'};d.append(g,m);
      }
      ql.appendChild(d);
    });
    bs.appendChild(ql);vt.appendChild(bs);
  }
  root.appendChild(vt);
  /* ---- 공부하기 ---- */
  const st=h('div','view');st.dataset.t='study';st.hidden=true;
  const fl=h('section',null,`<span class="eyebrow">글의 흐름</span><h2>${r.flowTitle}</h2><p class="muted">${r.flowNote}</p>`);
  const fg=h('div','flow');fg.style.gridTemplateColumns=`repeat(${r.flow.length},minmax(0,1fr))`;
  r.flow.forEach(([p,t,d,turn])=>fg.appendChild(h('div','stage'+(turn?' turn':''),`<span class="p">${p}</span><strong>${t}</strong><span>${d}</span>`)));
  fl.appendChild(fg);
  fl.appendChild(h('div','panel',`<div style="display:grid;gap:10px"><h3>${r.chain.title}</h3><div class="chain">${r.chain.items.map(x=>`<span>${x}</span>`).join(`<i>${r.chain.sep||'→'}</i>`)}</div><p class="muted" style="font-size:14px">${r.chain.note}</p></div>`));
  st.appendChild(fl);
  const ns=h('section',null,`<span class="eyebrow">문단별 정리</span><h2>각 문단의 역할과 출제 포인트</h2>`);
  ns.appendChild(h('div','panel',r.notes.map(([n,tag,sum,hooks])=>`<div class="para"><div class="tag">${n}<small>${tag}</small></div><div class="body"><p>${sum}</p><ul class="hooks">${hooks.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`).join('')));
  ns.lastChild.style.paddingBlock='4px';
  st.appendChild(ns);
  st.appendChild(h('section',null,`<span class="eyebrow">어휘 함정</span><h2>어휘 문제에서 바꿔칠 만한 표현</h2><div class="pairs">${r.traps.map(([a,no])=>`<div class="pair"><span>${a.replace(/<y>/g,'<span class="yes">').replace(/<\/y>/g,'</span>')}</span><span class="no">${no}</span></div>`).join('')}</div>`));
  st.appendChild(h('section',null,`<span class="eyebrow">서술형 대비</span><h2>서술형 감점을 막는 30초 점검</h2><div class="panel"><ol class="checklist"><li><span>주어진 단어·힌트에 동그라미. 하나도 빠짐없이, <b>요구한 형태로</b> 썼는가? (같은 뜻의 다른 단어로 바꾸면 감점)</span></li><li><span>힌트에 문법 구조가 적혀 있다면 그 구조를 그대로 썼는가?</span></li><li><span>빈칸 <b>뒤</b>에 이어지는 말과도 맞는가? (수 일치, 관계사절의 동사 등)</span></li><li><span>질문이 두 개 이상(무엇/왜)이면 각각 답했는가? 단어 수·문장 수 조건은 지켰는가?</span></li></ol></div>`));
  root.appendChild(st);
  /* ---- 문제 풀기 ---- */
  const te=h('div','view');te.dataset.t='test';te.hidden=true;
  const sc=h('div','panel score',`<span>객관식</span><b>0 / ${r.mc.length}</b><span class="muted">0문항 풀이</span>`);
  te.appendChild(sc);te.appendChild(mcBlock(r.mc,sc,''));
  te.appendChild(h('section',null,`<span class="eyebrow">서술형${r.wr.some(w=>w.stem)?' · 학교 작문 연습 유형 포함':''}</span><p class="muted" style="font-size:14px">체크 표시는 <b>조건</b>만 확인한다(의미 채점 아님). 다 쓴 뒤 모범 답안과 비교하자.</p>`));
  te.appendChild(wrBlock(r.wr));
  root.appendChild(te);
  return root;
}

const main=$('#main'),rbar=$('#rbar'),tabs=$$('#tabs button');
const views={};
R.sort((a,b)=>a.id.localeCompare(b.id)).forEach(r=>{
  const b=h('button',null,`<span class="n">${r.num}</span>${r.short}`);b.dataset.r=r.id;b.setAttribute('aria-pressed','false');
  b.onclick=()=>show(r.id,store.t||'text');rbar.appendChild(b);
});
function show(id,t){
  store.r=id;store.t=t;save();
  if(!views[id]){views[id]=build(R.find(r=>r.id===id));main.appendChild(views[id])}
  Object.entries(views).forEach(([k,v])=>v.hidden=k!==id);
  $$('.view',views[id]).forEach(v=>v.hidden=v.dataset.t!==t);
  $$('button',rbar).forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===id));
  tabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  const r=R.find(x=>x.id===id);$('#meta').textContent=`Reading ${r.num} ${r.short}`;
  pop.hidden=true;window.scrollTo({top:0});
}
tabs.forEach(b=>b.onclick=()=>show(store.r,b.dataset.t));
/* popover */
const pop=$('#pop');let popFor=null;
function openPop(el){
  const r=R.find(x=>x.id===store.r),k=el.dataset.k,g=el.classList.contains('g');
  pop.innerHTML=`<b>${k}</b> · ${r.dict[k]||''}<span class="tag">${g?'★ 본문 주석':'단어장'}</span>`;pop.hidden=false;popFor=el;
  const rc=el.getBoundingClientRect(),pw=pop.offsetWidth;
  let left=rc.left+window.scrollX+rc.width/2-pw/2;left=Math.max(16,Math.min(left,document.documentElement.clientWidth-pw-16));
  pop.style.left=left+'px';pop.style.top=(rc.bottom+window.scrollY+6)+'px';
}
document.addEventListener('click',e=>{const el=e.target.closest('.hl');if(el&&!el.closest('.plain')&&!el.closest('.legend')){if(popFor===el&&!pop.hidden){pop.hidden=true;return}openPop(el)}else if(!e.target.closest('.pop'))pop.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')pop.hidden=true;if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('hl')){e.preventDefault();openPop(e.target)}});
show(R.some(r=>r.id===store.r)?store.r:'r1',['text','study','test'].includes(store.t)?store.t:'text');
</script>
<script>
// Theme toggle: flips whatever is showing now (saved choice, else the system setting) and remembers it.
$('#themebtn').onclick=()=>{
  const root=document.documentElement;
  const cur=root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  root.dataset.theme=next;
  try{localStorage.setItem('eng3q-theme',next)}catch(e){}
};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
